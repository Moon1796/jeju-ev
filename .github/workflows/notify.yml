yaml
name: 제주 충전소 빈자리 감시

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 실행
  workflow_dispatch: {}        # Actions 탭에서 수동 실행도 가능

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 충전소 상태 확인 및 알림 발송
        run: node scripts/check-availability.js
        env:
          EVCHARGER_KEY: ${{ secrets.EVCHARGER_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}

      - name: snapshot.json 저장
        run: |
          git config user.name "jeju-ev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot.json
          git diff --quiet --cached || git commit -m "충전소 상태 스냅샷 갱신"
          git push
